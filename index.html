<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="description" content="車・バイクの維持費・燃費・メンテナンス記録">

<meta name="apple-mobile-web-app-title" content="維持費">
<link rel="manifest" href="manifest.webmanifest">

<body>
<div class="shell">

<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="drop" class="drop" hidden><div><i class="ti ti-file-upload" aria-hidden="true"></i><p>ここにドロップ</p><span>Excel（.xlsx）・バックアップ（.json）・レシート／整備記録（画像・PDF）</span></div></div>
